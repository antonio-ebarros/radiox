# Works with Docker and Podman:
#   docker compose up -d --build        (or: podman compose up -d --build)
# Reads MUSIC_PATH and PORT from the .env file (see .env.example).
name: radiox

services:
  radiox:
    build:
      context: .
      dockerfile: Containerfile
    image: radiox
    container_name: radiox
    ports:
      - "${PORT:-8090}:8000"
    volumes:
      - "${MUSIC_PATH:?Set MUSIC_PATH in .env (see .env.example)}:/musica:ro"
      - radiox-data:/data
    environment:
      AUTO_SCAN_SECONDS: "${AUTO_SCAN_SECONDS:-60}"
    restart: unless-stopped

volumes:
  radiox-data:
    name: radiox-data   # same volume the radiox.sh script uses
